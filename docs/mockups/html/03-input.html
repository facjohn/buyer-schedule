<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>③ 스케줄 입력</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0;background:#E9EBEA} .frame{margin:24px auto;width:390px;box-shadow:0 2px 12px rgba(0,0,0,.12)}</style>
</head>
<body>
<!-- 화면 시안을 그대로 찍어 둔 정적 HTML입니다. 버튼은 동작하지 않습니다. 색, 크기, 간격 참고용. -->
<div class="frame">
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #FFFFFF; color: #18201D; font-family: 'IBM Plex Sans KR', sans-serif; display: flex; flex-direction: column;">
  <header style="display: flex; align-items: center; gap: 4px; padding: 12px 16px 4px 4px;">
    <a href="Supply.dc.html" aria-label="닫기" style="width: 44px; height: 44px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; color: #18201D; text-decoration: none;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
    </a>
    <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px;">
      <h1 style="margin: 0; font-size: 21px; line-height: 27px; font-weight: 700;">새 스케줄</h1>
      <p style="margin: 0; font-size: 13px; line-height: 18px; color: #56615C;">산지 정보에서 시작 · 바이어담당 김OO</p>
    </div>
  </header>

  <div style="flex: 1; min-height: 0; overflow-y: auto; box-sizing: border-box; padding: 4px 16px 100px; display: flex; flex-direction: column; gap: 10px;">
    <section aria-label="가져온 산지 정보" style="position: relative; display: flex; flex-direction: column; gap: 4px; padding: 12px 14px; background: #F4F5F3; border: 1px solid #E2E6E3; border-radius: 14px;">
      <div style="display: flex; align-items: center; gap: 8px; padding-right: 84px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1F6B4F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21v-9"></path><path d="M12 12c0-4.4 3.2-7.5 8-7.5 0 4.8-3.2 7.5-8 7.5z"></path><path d="M12 14c0-3.6-2.6-6-6.5-6 0 3.8 2.6 6 6.5 6z"></path></svg>
        <span style="font-size: 15px; line-height: 22px; font-weight: 700;">신고배 · 나주 김OO 농가</span>
      </div>
      <p style="margin: 0; font-size: 13px; line-height: 19px; color: #3F4A45;">물량 40ft 2대 · 산지가 5kg 7과 ₩16,000 · 상차 가능 10월 24일 (토)부터</p>
      <a href="Supply.dc.html" style="position: absolute; top: 0; right: 0; height: 44px; display: flex; align-items: center; padding: 0 14px; color: #1F6B4F; font-size: 13px; font-weight: 700; text-decoration: none;">다른 물량</a>
    </section>

    <div style="display: grid; grid-template-columns: minmax(0, 1fr) 108px; gap: 10px;">
      <div style="display: flex; flex-direction: column; gap: 6px;">
        <label for="buyer" style="font-size: 13px; line-height: 18px; font-weight: 600; color: #56615C;">바이어</label>
        <div style="position: relative;">
          <select id="buyer" style="width: 100%; height: 48px; box-sizing: border-box; appearance: none; padding: 0 40px 0 14px; border: 1px solid #D5DBD7; border-radius: 12px; background: #FFFFFF; color: #18201D; font-family: inherit; font-size: 16px;">
            <option>바이어 A · 대만</option>
            <option>바이어 B · 말레이시아</option>
            <option>바이어 C · 인도네시아</option>
            <option>바이어 E · 미국</option>
          </select>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#56615C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="position: absolute; right: 14px; top: 15px; pointer-events: none;"><path d="M6 9l6 6 6-6"></path></svg>
        </div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px;">
        <span style="font-size: 13px; line-height: 18px; font-weight: 600; color: #56615C;">No.</span>
        <div role="button" aria-label="No. 고르기: 새 번호 또는 같은 컨테이너의 기존 번호" style="height: 48px; box-sizing: border-box; display: flex; align-items: center; gap: 6px; padding: 0 10px 0 12px; border: 1px solid #D5DBD7; border-radius: 12px; background: #FFFFFF;">
          <span style="font-size: 17px; font-weight: 700;">7</span>
          <span style="flex: 1; min-width: 0; font-size: 12px; color: #56615C; white-space: nowrap;">새 번호</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#56615C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
        </div>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px;">
      <span style="font-size: 13px; line-height: 18px; font-weight: 600; color: #56615C;">운송</span>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); padding: 2px; background: #EEF1EF; border-radius: 12px;">
        
          <button type="button" aria-pressed="false" style="height: 44px; border: 0; border-radius: 10px; background: transparent; color: #56615C; box-shadow: none; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer;">20ft</button>
        
          <button type="button" aria-pressed="true" style="height: 44px; border: 0; border-radius: 10px; background: #FFFFFF; color: #18201D; box-shadow: 0 1px 2px rgba(0, 0, 0, 0.12); font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer;">40ft</button>
        
          <button type="button" aria-pressed="false" style="height: 44px; border: 0; border-radius: 10px; background: transparent; color: #56615C; box-shadow: none; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer;">항공</button>
        
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 4px;">
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px;">
        <div style="display: flex; flex-direction: column; gap: 6px;">
          <label for="spec" style="font-size: 13px; line-height: 18px; font-weight: 600; color: #56615C;">스펙 <span style="font-weight: 400;">· 직접 입력</span></label>
          <input id="spec" type="text" value="5kg 7과" style="width: 100%; height: 48px; box-sizing: border-box; padding: 0px 14px; border: 1px solid rgb(213, 219, 215); border-radius: 12px; background: rgb(255, 255, 255); color: rgb(24, 32, 29); font-family: inherit; font-size: 16px;">
        </div>
        <div style="display: flex; flex-direction: column; gap: 6px;">
          <label for="spec-en" style="font-size: 13px; line-height: 18px; font-weight: 600; color: #56615C;">영어 <span style="font-weight: 400;">· JPG용</span></label>
          <input id="spec-en" type="text" value="5kg, Size 7" style="width: 100%; height: 48px; box-sizing: border-box; padding: 0px 14px; border: 1px solid rgb(213, 219, 215); border-radius: 12px; background: rgb(247, 248, 247); color: rgb(24, 32, 29); font-family: inherit; font-size: 16px;">
        </div>
      </div>
      <p style="margin: 0; font-size: 12px; line-height: 17px; color: #56615C;">한 번 쓴 스펙은 영어가 자동으로 채워집니다</p>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px;">
      <label for="eta" style="font-size: 13px; line-height: 18px; font-weight: 600; color: #56615C;">ETA</label>
      <div style="position: relative;">
        <input id="eta" type="text" value="12월 8일 (화)" style="width: 100%; height: 48px; box-sizing: border-box; padding: 0px 44px 0px 14px; border: 1px solid rgb(213, 219, 215); border-radius: 12px; background: rgb(255, 255, 255); color: rgb(24, 32, 29); font-family: inherit; font-size: 16px;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#56615C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="position: absolute; right: 14px; top: 14px; pointer-events: none;"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg>
      </div>
      <p style="margin: 0; display: flex; align-items: center; gap: 6px; font-size: 13px; line-height: 18px; font-weight: 600; color: #1F6B4F;">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
        <span>상차 가능일(10월 24일) 이후라 문제없습니다</span>
      </p>
    </div>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px;">
      <div style="display: flex; flex-direction: column; gap: 6px;">
        <label for="price" style="font-size: 13px; line-height: 18px; font-weight: 600; color: #56615C;">바이어가 <span style="font-weight: 400;">· 직전 값</span></label>
        <div style="display: flex; align-items: center; gap: 6px; height: 48px; box-sizing: border-box; padding: 0 12px; border: 1px solid #D5DBD7; border-radius: 12px; background: #FFFFFF;">
          <span style="font-size: 16px; color: #56615C;">$</span>
          <input id="price" type="text" value="14.20" style="flex: 1 1 0%; min-width: 0px; height: 44px; border: 0px; outline: none; background: transparent; color: rgb(24, 32, 29); font-family: inherit; font-size: 16px;">
        </div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px;">
        <label for="cost" style="font-size: 13px; line-height: 18px; font-weight: 600; color: #56615C;">산지가 <span style="font-weight: 400;">· 산지 정보</span></label>
        <div style="display: flex; align-items: center; gap: 6px; height: 48px; box-sizing: border-box; padding: 0 12px; border: 1px solid #D5DBD7; border-radius: 12px; background: #F7F8F7;">
          <span style="font-size: 16px; color: #56615C;">₩</span>
          <input id="cost" type="text" value="16,000" style="flex: 1 1 0%; min-width: 0px; height: 44px; border: 0px; outline: none; background: transparent; color: rgb(24, 32, 29); font-family: inherit; font-size: 16px;">
        </div>
      </div>
    </div>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px;">
      <div style="display: flex; flex-direction: column; gap: 6px;">
        <label for="qty" style="font-size: 13px; line-height: 18px; font-weight: 600; color: #56615C;">수량 <span style="font-weight: 400;">· 내부용</span></label>
        <input id="qty" type="text" value="40ft 1대" style="width: 100%; height: 48px; box-sizing: border-box; padding: 0px 14px; border: 1px solid rgb(213, 219, 215); border-radius: 12px; background: rgb(255, 255, 255); color: rgb(24, 32, 29); font-family: inherit; font-size: 16px;">
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px;">
        <span style="font-size: 13px; line-height: 18px; font-weight: 600; color: #56615C;">상태</span>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); padding: 2px; background: #EEF1EF; border-radius: 12px;">
          
            <button type="button" aria-pressed="true" style="height: 44px; border: 0; border-radius: 10px; background: #FFFFFF; color: #18201D; box-shadow: 0 1px 2px rgba(0, 0, 0, 0.12); font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer;">미정</button>
          
            <button type="button" aria-pressed="false" style="height: 44px; border: 0; border-radius: 10px; background: transparent; color: #56615C; box-shadow: none; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer;">확정</button>
          
        </div>
      </div>
    </div>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px;">
      <button type="button" style="height: 44px; display: flex; align-items: center; gap: 6px; padding: 0 12px; border: 1px dashed #B3BCB7; border-radius: 12px; background: #FFFFFF; color: #1F6B4F; font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
        <span>메모 (내부용)</span>
      </button>
      <button type="button" aria-pressed="false" style="height: 44px; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 0 10px 0 12px; border: 1px solid #D5DBD7; border-radius: 12px; background: #FFFFFF; color: #18201D; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;">
        <span>매주 반복</span>
        <span style="position: relative; flex-shrink: 0; display: inline-block; width: 40px; height: 24px; border-radius: 12px; background: #B3BCB7;">
          <span style="position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 9px; background: #FFFFFF;"></span>
        </span>
      </button>
    </div>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; display: grid; grid-template-columns: 1fr 2fr; gap: 10px; padding: 12px 16px 24px; background: #FFFFFF; border-top: 1px solid #E2E6E3;">
    <a href="Supply.dc.html" style="height: 52px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; border: 1px solid #D5DBD7; border-radius: 14px; background: #FFFFFF; color: #18201D; font-size: 16px; font-weight: 600; text-decoration: none;">취소</a>
    <a href="Schedule.dc.html" style="height: 52px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; border-radius: 14px; background: #1F6B4F; color: #FFFFFF; font-size: 16px; font-weight: 600; text-decoration: none;">바이어 A 스케줄에 저장</a>
  </div>
</div>
</div>
</body>
</html>
